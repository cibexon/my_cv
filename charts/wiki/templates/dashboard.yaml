{{- if .Values.dashboard.enabled }}
# The Grafana sidecar in kube-prometheus-stack picks up ConfigMaps labelled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wiki.fullname" . }}-dashboard
  labels:
    {{- include "wiki.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  wiki-slo.json: |-
    {{- .Files.Get "files/dashboard.json"
        | replace "__SELECTOR__" (include "wiki.promSelector" . | replace "\"" "\\\"")
        | replace "__AVAIL_TARGET__" (.Values.slo.availability.target | toString)
        | replace "__LATENCY_TARGET__" (.Values.slo.latency.target | toString)
        | replace "__LATENCY_THRESHOLD__" .Values.slo.latency.threshold
        | nindent 4 }}
{{- end }}
