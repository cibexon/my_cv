apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # first: it brings the ServiceMonitor/PrometheusRule CRDs the wiki needs
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.18.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/deploy/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/cibexon/my_cv.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true        # the Prometheus CRDs are too big for the client-side last-applied annotation
