# ArgoCD manages its own Helm release: bump targetRevision in Git → ArgoCD upgrades itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.12.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/deploy/values/argocd.yaml
    - repoURL: https://github.com/cibexon/my_cv.git
      targetRevision: main
      ref: values                  # makes "$values" point to this repo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false                 # never let a mistake delete ArgoCD itself
      selfHeal: true
